const W=1920,H=1080, cv=document.getElementById('c'), g=cv.getContext('2d');
const VP={x:W*0.52, y:H*0.42};           // vanishing point
const HORIZON=VP.y;
const JADE='#4FB39A', AMBER='#E8A33D', INK='#F2F4F3', GRAPH='#0E1216';
const TRACKS=8;
const WORDS=['scan','standup','decision','sprint','task','chat'];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=(t)=>t<0?0:t>1?1:t*t*(3-2*t);
const lerp=(a,b,t)=>a+(b-a)*t;
// a track i at bottom-x position bx converges to VP. Rail pair spacing at bottom ~ 150.
function trackBottomX(i){ return W*0.5 + (i-3.5)*300; }
function railAt(bx, dy){ // dy: 0 at horizon .. 1 at bottom; returns x
  const t=dy; return VP.x + (bx-VP.x)*t;
}
function yAt(d){ return lerp(HORIZON, H+40, d); }

function drawSky(t){
  const sky=g.createLinearGradient(0,0,0,HORIZON);
  sky.addColorStop(0,'#05070A'); sky.addColorStop(1,'#0D1419');
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  // ground
  const gr=g.createLinearGradient(0,HORIZON,0,H);
  gr.addColorStop(0,'#0D1419'); gr.addColorStop(1,'#15191C');
  g.fillStyle=gr; g.fillRect(0,HORIZON,W,H-HORIZON);
  // horizon haze
  const hz=g.createRadialGradient(VP.x,VP.y,0,VP.x,VP.y,900);
  hz.addColorStop(0,'rgba(232,163,61,0.16)'); hz.addColorStop(0.5,'rgba(232,163,61,0.04)'); hz.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=hz; g.fillRect(0,0,W,H);
}

function drawTracks(t, dim){
  // fade near->far: visible depth fraction
  const vis=1; // the yard is always there: the film loops
  for(let i=0;i<TRACKS;i++){
    const bx=trackBottomX(i);
    const near = Math.abs(i-3.5)<1.5;
    // ties
    g.save();
    for(let k=0;k<60;k++){
      const d=1-Math.pow(k/60,0.55); // depth 1 bottom .. 0 horizon (denser far)
      if (d < 1-vis) continue;
      const y=yAt(d); const xL=railAt(bx-80,d), xR=railAt(bx+80,d);
      g.strokeStyle=`rgba(90,98,104,${0.35*d*(1-dim)})`; g.lineWidth=Math.max(1,6*d);
      g.beginPath(); g.moveTo(xL,y); g.lineTo(xR,y); g.stroke();
    }
    g.restore();
    // rails: two lines from bottom to vanishing point, stop at visible depth
    for(const off of [-64,64]){
      const d0=1, d1=1-vis;
      const x0=railAt(bx+off,d0), y0=yAt(d0), x1=railAt(bx+off,d1), y1=yAt(d1);
      const grad=g.createLinearGradient(x0,y0,x1,y1);
      const a=near?0.95:0.6;
      grad.addColorStop(0,`rgba(190,200,205,${a*(1-dim)})`); grad.addColorStop(1,'rgba(190,200,205,0)');
      g.strokeStyle=grad; g.lineWidth=near?7:4; g.lineCap='round';
      g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
      // wet reflection highlight
      g.strokeStyle=`rgba(232,163,61,${0.18*(1-dim)})`; g.lineWidth=near?9:5;
      g.beginPath(); g.moveTo(x0,y0); g.lineTo(lerp(x0,x1,0.6),lerp(y0,y1,0.6)); g.stroke();
    }
  }
}

function drawLamps(t, dim){
  // lamps along the yard, left side, come on one by one 0.6..2.4s
  for(let k=0;k<6;k++){
    const d=0.95-k*0.15; const on=1;
    const x=railAt(trackBottomX(0)-260,d), yg=yAt(d), h=lerp(40,420,d);
    g.strokeStyle=`rgba(60,66,70,${0.9*(1-dim)})`; g.lineWidth=Math.max(2,10*d);
    g.beginPath(); g.moveTo(x,yg); g.lineTo(x,yg-h); g.stroke();
    if(on>0){
      const r=lerp(30,200,d)*on;
      const gl=g.createRadialGradient(x,yg-h,0,x,yg-h,r);
      gl.addColorStop(0,`rgba(232,163,61,${0.9*on*(1-dim)})`); gl.addColorStop(0.15,`rgba(232,163,61,${0.35*on*(1-dim)})`); gl.addColorStop(1,'rgba(232,163,61,0)');
      g.fillStyle=gl; g.beginPath(); g.arc(x,yg-h,r,0,7); g.fill();
      // ground pool
      const pool=g.createRadialGradient(x,yg,0,x,yg,r*1.6);
      pool.addColorStop(0,`rgba(232,163,61,${0.25*on*(1-dim)})`); pool.addColorStop(1,'rgba(232,163,61,0)');
      g.fillStyle=pool; g.save(); g.scale(1,0.35); g.beginPath(); g.arc(x,yg/0.35,r*1.6,0,7); g.fill(); g.restore();
    }
  }
}

const TRACK_I=2;
function zOf(t){ const p=clamp((t-1.6)/4.4,0,1); return p<0.62 ? 34*Math.pow(1/34, p/0.62) : 1 - (p-0.62)/0.38*14; }
function quad(pts,fill){ g.fillStyle=fill; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(const p of pts.slice(1)) g.lineTo(p[0],p[1]); g.closePath(); g.fill(); }
function sideText(word, bx, dn, df, color, alpha){
  // right side face between depths dn (near) and df (far), sliced perspective text
  const tmp=sideText.tmp||(sideText.tmp=document.createElement('canvas')); tmp.width=600; tmp.height=200;
  const c=tmp.getContext('2d'); c.clearRect(0,0,600,200); c.fillStyle=color; c.font='700 150px "Big Shoulders Display"'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(word,300,86); c.font='500 26px "JetBrains Mono"'; c.fillStyle='rgba(242,244,243,0.75)'; c.fillText('SPLU 00000'+(WORDS.indexOf(word.toLowerCase())+1)+' 7',300,166);
  const N=36; g.save(); g.globalAlpha=alpha;
  for(let k=0;k<N;k++){
    const a=k/N, b=(k+1)/N;
    // text runs from far (left of face, since train approaches) to near? Reading direction: near end is right on screen for right-side face; text left->right = far->near
    const d0=lerp(dn,df,a), d1=lerp(dn,df,b);
    const x0=railAt(bx+BOXHW,d0), x1=railAt(bx+BOXHW,d1);
    const yb0=yAt(d0)-BOXH*d0*0.09, h0=BOXH*d0*0.91;
    const pad=0.2; // vertical padding of text within face
    const sx=k*600/N; const sw=600/N;
    g.drawImage(tmp, sx,0,sw,200, Math.min(x0,x1), yb0-h0*(1-pad/2), Math.abs(x1-x0)+1, h0*(1-pad));
  }
  g.restore();
}
function drawTrain(t, dim){
  const z=zOf(t); if(t<1.6) return;
  const bx=trackBottomX(TRACK_I);
  // list cars far->near: loco at z, then containers behind (greater z)
  const cars=[{kind:'loco',z0:z,len:LOCOL}];
  let zz=z+LOCOL+0.15;
  for(let i=0;i<WORDS.length;i++){ cars.push({kind:'box',z0:zz,len:BOXL,i}); zz+=BOXL+0.12; }
  for(const car of cars.slice().reverse()){
    const dn=1/car.z0, df=1/(car.z0+car.len);
    if(car.z0+car.len<=0.3) continue; const dnC=Math.min(dn,3); if(car.z0<=0.3){ continue; } if(dn<0.02) continue;
    const col = car.kind==='loco'? JADE : COLORS[car.i];
    const shade=(hex,k)=>{ const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,gg=(n>>8)&255,b=n&255; return `rgb(${r*k|0},${gg*k|0},${b*k|0})`; };
    const xl=d=>railAt(bx-BOXHW,d), xr=d=>railAt(bx+BOXHW,d), yb=d=>yAt(d)-BOXH*d*0.09, yt=d=>yAt(d)-BOXH*d;
    quad([[railAt(bx-BOXHW*0.8,dn),yb(dn)],[railAt(bx+BOXHW*0.8,dn),yb(dn)],[railAt(bx+BOXHW*0.8,df),yAt(df)],[railAt(bx-BOXHW*0.8,df),yAt(df)]],'#14181B');
    quad([[railAt(bx-BOXHW*0.8,dn),yb(dn)],[railAt(bx+BOXHW*0.8,dn),yb(dn)],[railAt(bx+BOXHW*0.8,dn),yAt(dn)],[railAt(bx-BOXHW*0.8,dn),yAt(dn)]],'#1B2024');
    // top
    quad([[xl(dn),yt(dn)],[xr(dn),yt(dn)],[xr(df),yt(df)],[xl(df),yt(df)]], shade(col,0.55));
    // right side
    quad([[xr(dn),yt(dn)],[xr(dn),yb(dn)],[xr(df),yb(df)],[xr(df),yt(df)]], shade(col,0.8));
    // corrugation on side: thin dark lines along z
    g.save(); g.strokeStyle='rgba(0,0,0,0.22)'; g.lineWidth=Math.max(1,2.5*dn);
    const nC=Math.max(6,Math.round(car.len*14));
    for(let k=1;k<nC;k++){ const zc=car.z0+car.len*k/nC, d=1/zc; g.beginPath(); g.moveTo(xr(d),yt(d)); g.lineTo(xr(d),yb(d)); g.stroke(); }
    g.restore();
    if(car.kind==='box'){
      const near=clamp((dn-0.12)/0.5,0,1);
      sideText(WORDS[car.i].toUpperCase(), bx, dn, df, 'rgba(242,244,243,0.92)', near*(1-dim));
    }
    // end face (toward camera)
    quad([[xl(dn),yt(dn)],[xr(dn),yt(dn)],[xr(dn),yb(dn)],[xl(dn),yb(dn)]], col);
    if(car.kind==='loco'){
      // windscreen + headlamp
      const w=xr(dn)-xl(dn), h=BOXH*dn;
      g.fillStyle='#0B0F12'; g.fillRect(xl(dn)+w*0.12, yt(dn)+h*0.12, w*0.76, h*0.3);
      g.fillStyle=INK; g.beginPath(); g.arc(xl(dn)+w*0.5, yt(dn)+h*0.62, Math.max(2,w*0.05),0,7); g.fill();
      const gl=g.createRadialGradient(xl(dn)+w*0.5, yt(dn)+h*0.62,0, xl(dn)+w*0.5, yt(dn)+h*0.62, w*0.9);
      gl.addColorStop(0,'rgba(242,244,243,0.55)'); gl.addColorStop(1,'rgba(242,244,243,0)');
      g.fillStyle=gl; g.fillRect(0,0,W,H);
    } else {
      // container doors: two vertical bars
      const w=xr(dn)-xl(dn), h=BOXH*dn; g.fillStyle='rgba(0,0,0,0.3)';
      g.fillRect(xl(dn)+w*0.5-w*0.01, yt(dn), w*0.02, h);
      for(const fx of [0.3,0.42,0.58,0.7]) g.fillRect(xl(dn)+w*fx, yt(dn)+h*0.08, Math.max(1,w*0.015), h*0.84);
    }
  }
}

function drawMarkAndWord(t){
  const m=ease((t-4.4)/0.9); if(m<=0) return;
  // the two near rails of the centre-right track become the ∥ mark, centred
  const cx=W*0.5, baseY=H*0.62;
  const bx=trackBottomX(4);
  const A0=[railAt(bx-64,1),yAt(1)], A1=[railAt(bx-64,0.5),yAt(0.5)], B0=[railAt(bx+64,1),yAt(1)], B1=[railAt(bx+64,0.5),yAt(0.5)];
  const Af0=[cx-66,baseY], Af1=[cx-66,baseY-300], Bf0=[cx+66,baseY], Bf1=[cx+66+300*Math.tan(5*Math.PI/180),baseY-300];
  const L=(p,q)=>[lerp(p[0],q[0],m),lerp(p[1],q[1],m)];
  const a0=L(A0,Af0),a1=L(A1,Af1),b0=L(B0,Bf0),b1=L(B1,Bf1);
  g.save(); g.lineCap='round'; g.lineWidth=lerp(5,44,m);
  g.strokeStyle=INK;  g.beginPath(); g.moveTo(a0[0],a0[1]); g.lineTo(a1[0],a1[1]); g.stroke();
  g.strokeStyle='#D0694F'; g.beginPath(); g.moveTo(b0[0],b0[1]); g.lineTo(b1[0],b1[1]); g.stroke();
  g.restore();
}

function grain(){
  // cheap film grain: sparse dots
  g.save(); g.globalAlpha=0.05; g.fillStyle='#fff';
  let s=1234; const rnd=()=> (s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<4000;i++){ g.fillRect(rnd()*W, rnd()*H, 1.5, 1.5); }
  g.restore();
}

function sheetAlpha(t){ return t<1.0 ? 1 : t<1.9 ? 1-ease((t-1.0)/0.9) : t<6.0 ? 0 : ease((t-6.0)/1.0); }
function render(t){
  const sh=sheetAlpha(t); const dim=sh*0.62;
  drawSky(t);
  drawTracks(t,dim);
  drawLamps(t,dim);
  drawTrain(t,dim);
  // vignette
  const v=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.9); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.75)');
  g.fillStyle=v; g.fillRect(0,0,W,H);
  grain();
  if(sh>0){ g.save(); g.globalAlpha=sh; g.drawImage(SHEET,0,0,W,H); g.restore(); }
}
