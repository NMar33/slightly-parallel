<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slightly Parallel · intro · board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;background:#0B0D0F;height:100%;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Intro "board". 6 s. A Solari board: the top row clatters and settles on SLIGHTLY PARALLEL (0.4–2.6 s);
   five rows below fill with agents and states (2.4–5.0 s); the status lamps come on; hold to 6 s. */
const W=1920,H=1080,cv=document.getElementById('c'),g=cv.getContext('2d');
const ALPHA=' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:·-';
const CREAM='#EDE6D6', JADE='#4FB39A', AMBER='#E8A33D', FLAP='#1A1D20', FLAP2='#111417', SPLIT='#07090B';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function makeRow(text, x, y, cw, ch, fs, t0, step, spread, color){
  // each cell: start cycling at t0, settle at t0 + i*step + jitter
  const cells=[]; for(let i=0;i<text.length;i++){ cells.push({ch:text[i], settle:t0+i*step+rnd()*spread, start:t0, off:Math.floor(rnd()*ALPHA.length)}); }
  return {cells,x,y,cw,ch,fs,color};
}
const rows=[];
seed=7;
rows.push(makeRow('SLIGHTLY PARALLEL', 150, 160, 96, 150, 118, 0.4, 0.09, 0.5, CREAM));
const data=[
 ['01','CLAUDE · SCAN','14:07','ON TIME',JADE],
 ['02','CODEX · STANDUP','14:12','DELAYED',AMBER],
 ['03','OPENCODE · TESTS','14:20','BOARDING',JADE],
 ['04','CLAUDE · AUDIT','14:41','DONE',JADE],
 ['05','SECRETARY MVP','--:--','PARKED',CREAM],
];
data.forEach((r,k)=>{
  const y=420+k*112, t0=2.3+k*0.28;
  rows.push(makeRow(r[0], 150, y, 46, 76, 54, t0, 0.08, 0.2, CREAM));
  rows.push(makeRow(r[1].padEnd(18), 290, y, 46, 76, 54, t0, 0.05, 0.3, CREAM));
  rows.push(makeRow(r[2], 1250, y, 46, 76, 54, t0+0.2, 0.08, 0.2, CREAM));
  rows.push(makeRow(r[3].padEnd(8), 1520, y, 46, 76, 54, t0+0.3, 0.07, 0.25, r[4]));
});
const FLIPS=14; // flips per second while cycling
function charAt(cell,t){
  if(t>=cell.settle) return {cur:cell.ch, prev:cell.ch, p:1};
  if(t<cell.start) return {cur:' ', prev:' ', p:1};
  const n=Math.floor((t-cell.start)*FLIPS), p=((t-cell.start)*FLIPS)%1;
  const cur=ALPHA[(cell.off+n)%ALPHA.length], prev=ALPHA[(cell.off+n-1+ALPHA.length)%ALPHA.length];
  return {cur,prev,p};
}
function drawCell(x,y,w,h,fs,c,color){
  // plate
  g.fillStyle=FLAP; g.fillRect(x,y,w-4,h);
  g.fillStyle=FLAP2; g.fillRect(x,y+h/2,w-4,h/2);
  g.font=`600 ${fs}px Oswald`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=color;
  const cx=x+(w-4)/2, cy=y+h/2;
  // upper half: shows cur
  g.save(); g.beginPath(); g.rect(x,y,w-4,h/2); g.clip(); g.fillText(c.cur,cx,cy); g.restore();
  // lower half: prev until p>0.5 then cur, with a flap fold
  g.save(); g.beginPath(); g.rect(x,y+h/2,w-4,h/2); g.clip();
  if(c.p<0.5){ g.fillText(c.prev,cx,cy); }
  else { g.fillText(c.cur,cx,cy); }
  g.restore();
  if(c.p<1){
    // the moving flap: a half-plate rotating about the split; approximated by a vertically scaled half
    const s = c.p<0.5 ? 1-2*c.p : 2*c.p-1;
    g.save(); g.translate(cx,cy); g.scale(1,Math.max(0.02,s));
    if(c.p<0.5){ // top half of prev falling
      g.fillStyle=FLAP; g.fillRect(-(w-4)/2,-h/2,w-4,h/2);
      g.beginPath(); g.rect(-(w-4)/2,-h/2,w-4,h/2); g.clip(); g.fillStyle=color; g.fillText(c.prev,0,0);
    } else { // bottom half of cur arriving
      g.fillStyle=FLAP2; g.fillRect(-(w-4)/2,0,w-4,h/2);
      g.beginPath(); g.rect(-(w-4)/2,0,w-4,h/2); g.clip(); g.fillStyle=color; g.fillText(c.cur,0,0);
    }
    g.restore();
  }
  // split line
  g.fillStyle=SPLIT; g.fillRect(x,y+h/2-2,w-4,4);
}
function render(t){
  g.fillStyle='#0B0D0F'; g.fillRect(0,0,W,H);
  // board frame
  g.fillStyle='#0E1114'; g.fillRect(100,110,1720,860);
  g.strokeStyle='#1E2327'; g.lineWidth=2; g.strokeRect(100,110,1720,860);
  // headers
  g.font='500 20px "JetBrains Mono"'; g.fillStyle='#5E6A6F'; g.textAlign='left'; g.textBaseline='alphabetic';
  const hv=clamp((t-2.1)/0.4,0,1); g.globalAlpha=hv;
  g.fillText('PLAT',150,392); g.fillText('DESTINATION',290,392); g.fillText('TIME',1250,392); g.fillText('STATUS',1520,392);
  g.globalAlpha=1;
  for(const r of rows){
    for(let i=0;i<r.cells.length;i++){
      const cell=r.cells[i]; const c=charAt(cell,t);
      drawCell(r.x+i*r.cw, r.y, r.cw, r.ch, r.fs, c, r.color);
    }
  }
  // lamps at the right of each data row
  data.forEach((r,k)=>{ const on=clamp((t-(2.3+k*0.28+0.9))/0.3,0,1); if(on<=0) return;
    const x=1836,y=420+k*112+38; const gl=g.createRadialGradient(x,y,0,x,y,26); gl.addColorStop(0,r[4]); gl.addColorStop(0.3,r[4]+'AA'); gl.addColorStop(1,r[4]+'00');
    g.globalAlpha=on; g.fillStyle=gl; g.beginPath(); g.arc(x,y,26,0,7); g.fill(); g.fillStyle=r[4]; g.beginPath(); g.arc(x,y,7,0,7); g.fill(); g.globalAlpha=1; });
  // footer line
  const fv=clamp((t-5.0)/0.5,0,1); g.globalAlpha=fv; g.font='500 18px "JetBrains Mono"'; g.fillStyle='#737B78'; g.textAlign='right';
  g.fillText('AGENTS, SIDE BY SIDE  ·  SLIGHTLYPARALLEL.DEV',1800,955); g.globalAlpha=1;
  // scanline vignette
  const v=g.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.95); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.6)');
  g.fillStyle=v; g.fillRect(0,0,W,H);
}
window.__render=render; window.__duration=6.0;
Promise.all([document.fonts.load('600 118px Oswald'),document.fonts.load('500 20px "JetBrains Mono"')]).then(()=>{
  if(location.hash==='#capture'){ render(0); window.__ready=true; return; }
  const t0=performance.now(); (function loop(){ const t=((performance.now()-t0)/1000)%7; render(Math.min(t,6)); requestAnimationFrame(loop); })();
});
</script>
</body>
</html>
