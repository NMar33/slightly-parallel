    artifact: {at: [1700, 1460], t: "#artifact", s: "результат папкой", n: "c:artifact", who: "oa", cmds: [artifact], lp: s}
    publish: {at: [1900, 1460], t: "#publish", s: "«выпущено» + задачи, коммиты", n: "c:publish", who: "o", cmds: [publish], lp: n}
    card: {at: [2130, 1460], t: "Карточка", s: "вложения от агента", n: "l:publish_attachments", who: "a", lp: s}
    articles: {at: [2400, 1460], t: "Статьи и посты", s: "проект текстов", who: "o", lp: n}
    # --- context
    entry: {at: [660, 1250], t: "#entrypoint", s: "где живёт тема, где остановились", n: "c:entrypoint", who: "oa", cmds: [entrypoint], lp: w}
    important: {at: [660, 1360], t: "#important · #pin", s: "звёзды и закрепы", n: "l:marks", who: "o", cmds: [important, important-agent, important-task, important-message, pin], lp: w}
    carry: {at: [660, 1470], t: "#carry · #carry-brief", s: "сообщение переживёт сжатие", n: "c:carry", who: "o", cmds: [carry, carry-brief], lp: w}
    fork: {at: [660, 1580], t: "#fork-later", s: "работа для другого агента", n: "c:fork-later", who: "o", cmds: [fork-later], lp: w}
    compress: {at: [880, 1660], t: "Сжатие контекста", s: "агент забывает разговор", who: "a", lp: s}
    back: {at: [1100, 1660], t: "Слова снова у агента", s: "хук возвращает их", who: "s", lp: n}
    # --- service
    mute: {at: [500, 890], t: "#mute", s: "все теги выключены", n: "c:mute", who: "o", cmds: [mute], lp: s}
    triple: {at: [340, 780], t: "###тег", s: "работает только этот тег", who: "o", lp: w}
    undo: {at: [340, 670], t: "#undo · #undo-yes", s: "ошибочные записи → архив", n: "c:undo", who: "oa", cmds: [undo, undo-yes], lp: w}
    sp: {at: [340, 560], t: "#sp", s: "проверка, что всё работает", n: "c:sp", who: "oa", cmds: [sp], lp: w}
    help: {at: [340, 450], t: "#help", s: "список команд", n: "c:help", who: "oa", cmds: [help], lp: w}
  inset:
    at: [1640, 36]
    title: "Задача — узел"
    lede: "откуда приходит и что к ней прикрепляется, 30 дней"
    from:
      - ["#now-todo …", "o:#now-<колонка>", "o"]
      - ["#now", "o:#now", "o"]
      - ["#task", "o:#task (агент)", "a"]
      - ["доска вручную", "o:доска (вручную)", "o"]
    attach:
      - ["коммиты по участку чата", "f:commits", "s"]
      - ["время", "l:time_entries", "s"]
      - ["участок чата (#done)", "l:done", "s"]
      - ["отчёт агента, всё время", "p:отчёт агента", "a"]
      - ["связи ядер с задачей", "f:core_links.task", "a"]
      - ["заметки агента", "f:notes_on_task", "a"]
      - ["доказательства", "l:task_evidence", "a"]
      - ["вложения публикаций", "l:publish_attachments", "a"]
  links: []

flow:
  title: "Как всё связано: потоки, как в экономике"
  lede: >-
    Шесть участников и всё, что идёт между ними. Цвет потока — кто действует.
    Команды стоят на тех потоках, которые запускают. Номер в кружке — петля:
    по ней результат возвращается и меняет следующую работу.
  height: 1900
  sectors:
    operator:
      box: [40, 560, 480, 600]
      who: o
      name: "Оператор"
      sub: "один разработчик"
      items:
        - ["пишет сообщения агентам", "m:d30"]
        - ["из них с командой", "m:with_command30"]
        - ["решает только он: статус, колонка, приоритет, одобрение"]
        - ["пишет статьи и посты"]
        - ["выпускает релиз"]
    program:
      box: [940, 470, 1200, 820]
      who: s
      name: "Программа"
      sub: "хук и сервер на том же ноутбуке"
    agents:
      box: [2580, 560, 436, 680]
      who: a
      name: "Агенты"
      sub: "Claude Code · Codex · OpenCode"
      items:
        - ["ответов агентов", "f:replies"]
        - ["делают работу в репозитории"]
        - ["записи пишут только через MCP"]
        - ["помощник пишет стендап и карту"]
        - ["при старте читают AGENTS.md и скиллы"]
    pages:
      box: [940, 90, 1200, 200]
      who: s
      name: "Страницы"
      sub: "что видит оператор"
      chips: ["Доска", "Чаты", "Видения", "Правила", "Проблемы", "Промпты", "Скиллы", "Решения", "Стендапы", "Архитектура", "Ядра", "Публикации", "Точки входа", "Важное", "Таймер", "Расход", "Монитор", "Заметки"]
    repo:
      box: [1900, 1440, 1116, 300]
      who: x
      name: "Репозиторий и CI"
      sub: "git на ноутбуке, GitHub"
      chain: ["master", "ветки ci-*", ["Linux", "macOS", "Windows"], "main", "релиз"]
      chain_note: "scripts/publish-ci.sh → GitHub Actions на трёх системах → scripts/release.sh"
    outside:
      box: [40, 1440, 1000, 300]
      who: x
      name: "Наружу"
      sub: "что видят другие"
      items:
        - ["статьи и посты — проект текстов"]
        - ["релиз — ветка release на GitHub"]
        - ["артефакты — результат папкой", "c:artifact"]
  # inner parts of the program
  parts:
    hook: {box: [962, 560, 250, 520], name: "Хук", items: [["записывает каждое сообщение и ответ"], ["узнаёт теги = команды"], ["подсказывает агенту, что сделать"], ["после сжатия возвращает слова"], ["#mute выключает, ###тег — один"]]}
    mcp: {box: [1868, 560, 250, 520], name: "MCP", items: [["инструментов", "tools"], ["ставит подпись агента"], ["проверяет поля и словарь"], ["без MCP запись не принимается"]]}
  hub: {at: [1540, 860], r: 92, t: "ЗАДАЧА", n: "l:tasks"}
  satellites:
    - ["участок чата", "l:done", "s", -150]
    - ["коммиты", "f:commits", "s", -110]
    - ["время", "l:time_entries", "s", -70]
    - ["отчёт агента", "p:отчёт агента", "a", -30]
    - ["заметки", "f:notes_on_task", "a", 30]
    - ["доказательства", "l:task_evidence", "a", 70]
    - ["ядра", "f:core_links.task", "a", 110]
    - ["публикации", "l:publish", "o", 150]
  records:
    at: [962, 1110]
    cols: 4
    items:
      - ["Видения", "l:visions", "o"]
      - ["Правила", "l:rules", "o"]
      - ["Проблемы", "l:problems", "o"]
      - ["Промпты", "l:prompts", "o"]
      - ["Скиллы", "l:skills", "o"]
      - ["Точки входа", "l:entrypoints", "o"]
      - ["Толкования", "f:interpreted", "a"]
      - ["Решения", "l:decisions", "a"]
      - ["Стендапы", "l:standups", "a"]
      - ["Ядра", "l:cores", "a"]
      - ["Звёзды", "l:marks", "o"]
      - ["Токены", "f:usage_rows", "s"]
  files_box:
    box: [2190, 1060, 330, 170]
    name: "AGENTS.md и скиллы"
    sub: "в каждом репозитории"
    items: [["блок правил переписывает программа"], ["скиллы ставятся во все проекты"]]
  loops:
    box: [1070, 1440, 800, 300]
    items:
      - ["Работа", "оператор → чат → агент → коммиты → задача → доска → оператор"]
      - ["Слова → поведение", "#vision, #rule, #skill → AGENTS.md и скиллы → все агенты"]
      - ["Код → понимание", "коммиты → #scan → архитектура, карта → оператор и агенты"]
      - ["День", "все чаты дня → стендап → оператор утром"]
      - ["Контекст", "#carry → после сжатия хук возвращает слова агенту"]
  flows:
    - id: msgs
      who: o
      pts: [[520, 680], [962, 680]]
      loops: [1, 2]
      t: "сообщения с тегами"
      n: "m:with_command30"
      s: "хук записывает все, команды узнаёт"
      lab: [741, 666]
      lp: n
      catalog: true
    - id: chat
      who: o
      pts: [[150, 560], [150, 40], [2900, 40], [2900, 560]]
      radius: 90
      loops: [1]
      t: "разговор в чате: задание агенту"
      s: "агент отвечает в том же чате"
      n: "f:replies"
      lab: [2240, 54]
      lp: s
    - id: notices
      who: s
      pts: [[1212, 610], [1290, 610], [1290, 420], [2700, 420], [2700, 560]]
      radius: 40
      loops: [4, 5]
      t: "подсказки хука агенту"
      s: "что сделать по команде"
      chips: ["#now: запиши заголовок", "#done: допиши отчёт", "новый день: стендап", "#carry: слова после сжатия"]
      lab: [2240, 406]
      lp: n
      chipcols: 2
    - id: mcp
      who: a
      pts: [[2580, 760], [2118, 760]]
      loops: [1, 3, 4]
      t: "записи через MCP"
      s: "заголовки, толкования, отчёты, сканы, решения, стендапы"
      chips: ["#task", "#scan", "#architecture", "#page", "#map", "#decision", "#standup", "#evidence", "#skill", "#artifact", "#entrypoint", "#core-new", "#core-note", "#core", "#undo-yes", "#usage-price"]
      chipcols: 3
      lab: [2349, 784]
      lp: s
    - id: commits
      who: a
      pts: [[2760, 1240], [2760, 1440]]
      loops: [1, 3]
      t: "коммиты"
      n: "f:commits"
      s: "в master"
      lab: [2780, 1340]
      lp: e
    - id: tie
      who: s
      pts: [[2000, 1440], [2000, 1370], [1720, 1370], [1720, 1290]]
      radius: 40
      loops: [1, 3]
      t: "коммиты к задаче"
      s: "по участку чата, сама"
      lab: [1860, 1356]
      lp: n
    - id: rules
      who: s
      kind: behav
      pts: [[2140, 1145], [2190, 1145]]
      loops: [2]
      t: ""
    - id: read
      who: a
      kind: behav
