# Layout of the two system maps (sysmap.py, tk_bba7c02c). Kept by hand.
#
# Coordinates are css px inside the map area (3200 wide). A station's `n` is
# a count key resolved from feature-map.json (30 days):
#   c:<card id>      commands of that card typed by the operator
#   t:<cmd>,<cmd>    those commands typed
#   l:<ledger>       records written      lt:<ledger>  records, all time
#   f:<flow key>     program's own streams (commits, usage_rows, interpreted …)
#   o:<origin>       where tasks came from   p:<part>  what agents added to tasks
#   m:<key>          chat messages (d30, with_command30)
# `who` letters: o operator, s program (hook and server), a agent, x outside.
# `cmds` lists the commands a station stands for; build.py warns about any
# command of the program that no station names.

metro:
  title: "Как всё связано: схема-метро"
  lede: >-
    Линия — процесс, станции на ней идут по порядку. Станция — команда или запись.
    Пересадка — место, где процессы встречаются: сообщение, задача, коммиты,
    AGENTS.md, агенты, стендап, релиз. Значок у станции — кто действует.
  height: 1780
  lines:
    work:
      name: "Работа"
      note: "круг: задача → коммиты → #done → стендап → снова задача"
      color: "#1f1e1c"
      width: 15
      closed: true
      pts: [[800, 760], [2500, 760], [2500, 1300], [800, 1300]]
      radius: 80
      tag: [2060, 1130]
    tasks:
      name: "Поставить задачу"
      note: "задачи на потом и с доски"
      color: "#8a877f"
      pts: [nowdone, board, nowcol, tasktag, [1140, 600], task]
      tag: [560, 690]
    words:
      name: "Слова → поведение"
      note: "слова оператора становятся правилом, правило меняет всех агентов"
      color: "#7a4cc2"
      pts: [vision, interp, rule, agentsmd, [1190, 200], agents]
      tag: [60, 290]
    words2:
      color: "#7a4cc2"
      pts: [prompt, problem, [560, 120], interp]
      branch: words
    skills:
      color: "#7a4cc2"
      pts: [skill, skillin, agents]
      branch: words
    dev:
      name: "Разработка"
      note: "агенты → master → CI на трёх системах → релиз"
      color: "#0b8ba3"
      pts: [agents, [1550, 450], commits, [2170, 450], ci, [2800, 450], linux, macos, windows, main, release]
      tag: [2560, 405]
    code:
      name: "Код → понимание"
      note: "что изменилось → архитектура → карта → ядра"
      color: "#b8860b"
      pts: [commits, [1860, 960], scan, files, arch, page, map, corenew, corenote]
      tag: [2010, 905]
    day:
      name: "День"
      note: "расход и чаты дня → стендап → карта"
      color: "#3a4fb0"
      pts: [usageprice, usage, tokens, [1300, 1700], firstchat, standupcmd, standup, map]
      tag: [2130, 1690]
    publish:
      name: "Наружу"
      note: "сделанное → статьи → релиз"
      color: "#c2357c"
      pts: [artifact, publish, card, articles, release]
      tag: [2290, 1495]
    context:
      name: "Контекст"
      note: "что должно пережить сжатие разговора"
      color: "#96592a"
      pts: [msg, [660, 1170], entry, important, carry, fork, [660, 1660], compress, back]
      tag: [430, 1625]
      tag_side: w
    service:
      name: "Служебные"
      note: "проверить, отменить, выключить"
      color: "#8d8b85"
      dash: "2 14"
      pts: [msg, [660, 890], mute, [340, 890], triple, undo, sp, help]
      tag: [30, 960]
  stations:
    # --- the work ring
    msg: {at: [800, 1030], hub: true, t: "Сообщение в чате", s: "хук записывает каждое; тег = команда", n: "m:d30", who: "os", lp: w}
    now: {at: [1020, 760], t: "#now", s: "сообщение → задача в работе", n: "c:now", who: "o", cmds: [now, now-doing], lp: n}
    task: {at: [1300, 760], hub: true, t: "ЗАДАЧА", s: "узел: к ней сходится вся работа", n: "l:tasks", who: "s", lp: s}
    work: {at: [1500, 760], t: "Агент работает", s: "заголовок, код, тесты", who: "a", lp: n}
    decision: {at: [1680, 760], t: "#decision", s: "решения после работы", n: "l:decisions", who: "a", cmds: [decision], lp: n}
    commits: {at: [1860, 760], hub: true, t: "Коммиты", s: "программа привязывает к задаче", n: "f:commits", who: "as", lp: se}
    tests: {at: [2180, 760], t: "Тесты", s: "pytest · vitest · e2e окна", who: "a", lp: n}
    done: {at: [2500, 1030], t: "#done", s: "закрыть текущую задачу,|забрать её участок чата", n: "c:done", who: "o", cmds: [done], lp: w}
    stretch: {at: [2260, 1300], t: "Участок чата", s: "коммиты, время, токены → задаче", n: "l:done", who: "s", lp: s}
    evidence: {at: [1980, 1300], t: "#evidence", s: "доказательства к задаче", n: "c:evidence", who: "oa", cmds: [evidence], lp: s}
    report: {at: [1700, 1300], t: "Отчёт", s: "одна строка агента", n: "p:отчёт агента", who: "a", lp: s}
    standup: {at: [1300, 1300], hub: true, t: "Стендап", s: "вчерашний день из всех чатов", n: "l:standups", who: "a", lp: ne}
    reads: {at: [1020, 1300], t: "Оператор читает", s: "доска, стендап → новое сообщение", who: "o", lp: s}
    # --- tasks
    nowdone: {at: [520, 600], t: "#now-done", s: "задача сразу в Done, без участка", n: "t:now-done", who: "o", cmds: [now-done], lp: s}
    board: {at: [710, 600], t: "Доска", s: "задача вручную", n: "o:доска (вручную)", who: "o", lp: n}
    nowcol: {at: [900, 600], t: "#now-todo …", s: "в колонку: todo, next, backlog, review, parked", n: "c:now-col", who: "o", cmds: [now-todo, now-to-do, now-next, now-backlog, now-review, now-parked], lp: s}
    tasktag: {at: [1080, 600], t: "#task", s: "агент пишет задачу из разговора", n: "c:task", who: "oa", cmds: [task], lp: n}
    # --- words
    prompt: {at: [180, 120], t: "#prompt", s: "в библиотеку промптов", n: "c:prompt", who: "o", cmds: [prompt], lp: n}
    problem: {at: [400, 120], t: "#problem", s: "открыта → решена", n: "c:problem", who: "o", cmds: [problem, problem solved], lp: n}
    vision: {at: [420, 200], t: "#vision", s: "слова дословно", n: "c:vision", who: "o", cmds: [vision], lp: s}
    interp: {at: [640, 200], t: "Толкование", s: "агент: смысл и контекст", n: "f:interpreted", who: "a", lp: s}
    rule: {at: [860, 200], t: "#rule", s: "правило оператора", n: "c:rule", who: "o", cmds: [rule], lp: s}
    agentsmd: {at: [1080, 200], hub: true, t: "AGENTS.md", s: "блок правил во всех проектах", who: "s", lp: n}
    skill: {at: [500, 450], t: "#skill", s: "процедура для агентов", n: "c:skill", who: "oa", cmds: [skill], lp: s}
    skillin: {at: [860, 450], t: "Скилл в проектах", s: "ставится во все проекты", who: "s", lp: s}
    agents: {at: [1440, 450], hub: true, t: "Агенты в чатах", s: "Claude Code · Codex · OpenCode", who: "a", lp: ne}
    # --- development
    ci: {at: [2380, 450], t: "Ветки ci-*", s: "scripts/publish-ci.sh", who: "a", lp: n}
    linux: {at: [2800, 620], t: "Linux", s: "GitHub Actions", who: "x", lp: e}
    macos: {at: [2800, 780], t: "macOS", s: "GitHub Actions", who: "x", lp: e}
    windows: {at: [2800, 940], t: "Windows", s: "GitHub Actions", who: "x", lp: e}
    main: {at: [2800, 1100], t: "main", s: "сборка релиза", who: "o", lp: e}
    release: {at: [2800, 1460], hub: true, t: "Релиз", s: "ветка release на GitHub", who: "ox", lp: e}
    # --- code
    scan: {at: [1760, 960], t: "#scan", s: "что изменилось", n: "c:scan", who: "oa", cmds: [scan], lp: n}
    files: {at: [1640, 960], t: "Файловая запись", s: "файлы скана", n: "lt:files", who: "a", lp: s}
    arch: {at: [1520, 960], t: "#architecture", s: "форма архитектуры", n: "lt:architecture", who: "oa", cmds: [architecture], lp: n}
    page: {at: [1410, 960], t: "#page", s: "страница проекта", n: "t:page", who: "oa", cmds: [page], lp: s}
    map: {at: [1300, 960], hub: true, t: "#map", s: "карта программы", n: "t:map", who: "oa", cmds: [map], lp: sw}
    corenew: {at: [1130, 960], t: "#core-new · #core-off", s: "ядро в виду / убрать", n: "l:cores", who: "oa", cmds: [core-new, core-off], lp: n}
    corenote: {at: [980, 960], t: "#core-note · #core", s: "заметка ядра, связь с задачей", n: "l:core_links", who: "oa", cmds: [core-note, core], lp: s}
    # --- day
    usageprice: {at: [2080, 1700], t: "#usage-price", s: "цены API от помощника", n: "c:usage-price", who: "oa", cmds: [usage-price], lp: n}
    usage: {at: [1860, 1700], t: "#usage", s: "токены и лимиты плана", n: "c:usage", who: "o", cmds: [usage, usage-on, usage-off, usage-warnings-on, usage-warnings-off], lp: n}
    tokens: {at: [1620, 1700], t: "Токены", s: "программа считает каждый ответ", n: "f:usage_rows", who: "s", lp: n}
    firstchat: {at: [1300, 1580], t: "Первый чат дня", s: "хук напоминает про стендап", who: "s", lp: e}
    standupcmd: {at: [1300, 1440], t: "#standup", s: "помощник читает все чаты дня", n: "c:standup", who: "oa", cmds: [standup], lp: e}
