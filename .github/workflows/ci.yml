name: CI
run-name: Diagnostic tmux input on macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-input:
    name: Trace real tmux WebSocket input (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install the production test dependencies and tmux
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.txt
          brew list tmux >/dev/null || brew install tmux
          tmux -V
      - name: Repeat both tests sixteen times with timestamps
        run: |
          mkdir -p diagnostic-results
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          root = Path("diagnostic-results")
          cases = [
              "tests/test_terminal.py::test_a_wrapped_line_above_does_not_shift_the_lines_cut_out",
              "tests/test_terminal.py::test_lines_are_cut_out_by_their_absolute_ids",
          ]
          failures = 0
          for attempt in range(1, 17):
              stem = root / f"run-{attempt:02d}"
              load = ["-n", "4", "--dist=loadfile", "tests/test_terminal_windows.py",
                      "tests/test_agent_screen.py", "tests/test_audit_round2.py"] if attempt > 8 else []
              command = [
                  sys.executable, "-m", "pytest", "-o", "addopts=", "-q", "-s",
                  "-p", "tests.tmux_input_diagnostics", *cases, *load,
                  f"--junitxml={stem.with_suffix('.xml')}",
              ]
              try:
                  result = subprocess.run(command, text=True, encoding="utf-8", errors="replace",
                                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180,
                                          env={**os.environ, "TMUX_TEST_TRACE_FILE": str(stem.resolve().with_suffix(".jsonl"))})
                  output, code = result.stdout, result.returncode
              except subprocess.TimeoutExpired as error:
                  output = (error.stdout or b"").decode("utf-8", errors="replace") + "\nDiagnostic run timed out.\n"
                  code = 124
              stem.with_suffix(".log").write_text(output, encoding="utf-8")
              print(f"attempt {attempt:02d} ({'parallel' if load else 'isolated'}): exit {code}", flush=True)
              failures += code != 0
          raise SystemExit(failures != 0)
          PY
      - name: Keep the diagnostic timing and JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-tmux-input-diagnostics
          path: backend/diagnostic-results/
          if-no-files-found: error
