name: CI
run-name: Queue timeout diagnostic on macOS
on: workflow_dispatch
jobs:
  queue-probe:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [full, repeat-1, repeat-2, repeat-3, repeat-4, repeat-5, repeat-6]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.lock -r backend/requirements-dev.txt
      - name: Repeat the real nested xdist case
        if: matrix.mode != 'full'
        working-directory: backend
        run: |
          for round in 1 2 3 4; do
            echo "Round $round"
            python -m pytest -q -o addopts='' -n 2 tests/test_verify_runner.py -k queue_timeout_reports
          done
      - name: Install tmux and set fixture identity
        if: matrix.mode == 'full'
        run: |
          brew install tmux
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Reproduce the full backend execution
        if: matrix.mode == 'full'
        working-directory: backend
        run: python -m pytest -q -rs -m 'not heavy' tests
