  launcher:
    if: ${{ !inputs.interactive_only }}
    # sp.py starts, supervises and stops Slightly Parallel the same way everywhere:
    # up (makes the backend environment, builds the UI), healthy, down, and
    # nothing left on the port.
    name: Launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Pipeline probe starts
        if: inputs.expect_failure
        working-directory: .
        run: echo SP_PIPELINE_PROBE_STARTED
      - name: Pipeline probe rejects a failed native command
        if: inputs.expect_failure
        working-directory: .
        run: |
          bash -c 'echo SP_PIPELINE_NATIVE_FAILURE; exit 73'
          echo SP_PIPELINE_UNREACHABLE
      - name: Pipeline probe rejects a failed PowerShell command
        if: failure() && inputs.expect_failure && runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -Command 'Write-Output SP_PIPELINE_POWERSHELL_FAILURE; exit 73'
          Write-Output SP_PIPELINE_UNREACHABLE
      - uses: actions/checkout@v7
        if: ${{ !inputs.expect_failure }}
      - uses: actions/setup-python@v7
        if: ${{ !inputs.expect_failure }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: ${{ !inputs.expect_failure }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The blank-machine scripts parse (scripts/machine)
        if: ${{ !inputs.expect_failure }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/machine/bootstrap.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
          if (-not $IsWindows) { bash -n scripts/machine/bootstrap.sh; if ($LASTEXITCODE) { exit 1 } }
          python scripts/machine/run.py --help | Out-Null; if ($LASTEXITCODE) { exit 1 }
      - name: Start in the background
        if: ${{ !inputs.expect_failure }}
        run: python sp.py up
      - name: The supervisor's log (on failure)
        if: ${{ !inputs.expect_failure && (failure()) }}
        shell: python
        env:
          PYTHONIOENCODING: utf-8   # the Windows console is cp1252; the log is utf-8
        run: |
          from pathlib import Path
          log = Path(".sp/server.log")
          print(log.read_text(encoding="utf-8", errors="replace")[-6000:] if log.is_file() else "no .sp/server.log")
      - name: Healthy
        if: ${{ !inputs.expect_failure }}
        run: python sp.py status
      - name: The resource monitor reads this machine (processor, memory, disks, network, ping, processes)
        if: ${{ !inputs.expect_failure }}
        run: python scripts/ci/monitor_check.py
      - name: A browser for the top bar
        if: ${{ !inputs.expect_failure }}
        working-directory: frontend
        run: npm ci && npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: The top bar shows the readings
        if: ${{ !inputs.expect_failure }}
        run: node scripts/ci/topbar_check.mjs
      - name: The top bar, as drawn
        if: ${{ !inputs.expect_failure && (always()) }}
        uses: actions/upload-artifact@v7
        with:
          name: topbar-${{ matrix.os }}
          path: .sp/ci/topbar.png
          if-no-files-found: ignore
      - name: "#sp's checks and the report, from the running server"
        if: ${{ !inputs.expect_failure }}
        run: python scripts/ci/checkup_check.py up
      - name: "Network off by the firewall (127.0.0.1 kept): the pages answer in time, Monitor says No connection"
        if: ${{ !inputs.expect_failure }}
        timeout-minutes: 10
        run: python scripts/ci/offline_check.py
      - name: Network on again (also when the check above failed or was stopped)
        if: ${{ !inputs.expect_failure && (always()) }}
        run: python scripts/ci/offline_check.py on
      - name: Stop
        if: ${{ !inputs.expect_failure }}
        run: python sp.py down
      - name: "sp.py check with the server down looks from outside"
        if: ${{ !inputs.expect_failure }}
        run: python scripts/ci/checkup_check.py down
      - name: Nothing left serving
        if: ${{ !inputs.expect_failure }}
        shell: python
        run: |
          import socket, sys
          s = socket.socket()
          s.settimeout(1)
          busy = s.connect_ex(("127.0.0.1", 8123)) == 0
          print("port 8123:", "still served" if busy else "free")
          sys.exit(1 if busy else 0)
      - name: Start at login and the shortcut, for real (the runner's own login entry, its shortcut, then off)
        if: ${{ !inputs.expect_failure }}
        run: python scripts/ci/autostart_check.py

  fresh-user:
    if: ${{ !inputs.interactive_only }}
    # A new user's path, with no agent: clone, first start, every page,
    # Setup in a browser, the hook and the MCP server, the terminal,
    # Disconnect, restart, the background run and the dev start
    # (scripts/fresh_user/README.md). The stages with a real agent are run
    # by hand: they need a login and cost tokens.
    name: Fresh user (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows takes about 25 minutes: the first start, the example and the volume stage are slower there.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Pipeline probe starts
        if: inputs.expect_failure
        working-directory: .
        run: echo SP_PIPELINE_PROBE_STARTED
      - name: Pipeline probe rejects a failed native command
        if: inputs.expect_failure
        working-directory: .
        run: |
          bash -c 'echo SP_PIPELINE_NATIVE_FAILURE; exit 73'
          echo SP_PIPELINE_UNREACHABLE
      - name: Pipeline probe rejects a failed PowerShell command
        if: failure() && inputs.expect_failure && runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -Command 'Write-Output SP_PIPELINE_POWERSHELL_FAILURE; exit 73'
          Write-Output SP_PIPELINE_UNREACHABLE
      - uses: actions/checkout@v7
        if: ${{ !inputs.expect_failure }}
        with:
          # The upgrade stage installs the last release tag first, then pulls.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: ${{ !inputs.expect_failure }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: ${{ !inputs.expect_failure }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Git identity (the test makes commits in its sample projects)
        if: ${{ !inputs.expect_failure }}
        run: git config --global user.email ci@example.com && git config --global user.name CI
      - name: tmux (the terminal stage; Windows has none, its terminal is plain, a ConPTY)
        if: ${{ !inputs.expect_failure && (runner.os != 'Windows') }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -qq tmux; else brew install tmux; fi
      - name: The browser the test drives
        if: ${{ !inputs.expect_failure }}
        working-directory: frontend
        run: npm ci && npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: From clone to a working setup
        if: ${{ !inputs.expect_failure }}
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/fresh_user/run.py --no-agent
      - name: The failed checks, with their detail (on failure)
        if: ${{ !inputs.expect_failure && (failure()) }}
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import json
          from pathlib import Path
          report = Path(".sp/fresh-user/report.json")
          if not report.is_file():
              print("no report: the run stopped before the install stage ended")
          else:
              for c in json.loads(report.read_text(encoding="utf-8")).get("checks", []):
                  if not c.get("ok"):
                      print(f"[{c.get('stage')}] {c.get('name')}\n    {c.get('detail', '')[-4000:]}")
      - name: Keep the report and the pictures
        if: ${{ !inputs.expect_failure && (always()) }}
        uses: actions/upload-artifact@v7
        with:
          name: fresh-user-${{ matrix.os }}
          path: .sp/fresh-user/
          include-hidden-files: true
