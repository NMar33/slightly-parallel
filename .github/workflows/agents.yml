# A real agent at work, on every system: the fresh-user test with Claude
# Code, Codex and OpenCode on cheap models, with two interactive turns and
# one headless helper check. It costs money, so it runs by hand and daily, never
# on a push. It needs the repository secrets ANTHROPIC_API_KEY and
# OPENAI_API_KEY (Codex and OpenCode); a missing key fails that job.
# The OpenAI model is the repository variable CODEX_MODEL (empty:
# Codex's own default; OpenCode then runs gpt-6-luna).
name: Agents

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "core (interactive release checks), smoke (two turns), full (legacy diagnostics)"
        type: choice
        options: [smoke, core, full]
        default: core
      channel:
        description: "Pinned CLI versions for a release, or latest for compatibility"
        type: choice
        options: [pinned, latest]
        default: pinned
      tools:
        description: "JSON list of tools"
        default: '["claude-code", "codex", "opencode"]'
      systems:
        description: "JSON list of systems"
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: agents-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  agent:
    name: ${{ matrix.tool }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The schedule has no inputs: then every system and tool.
        os: ${{ fromJSON(inputs.systems || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        tool: ${{ fromJSON(inputs.tools || '["claude-code", "codex", "opencode"]') }}
    env:
      PYTHONIOENCODING: utf-8
      CHANNEL: ${{ github.event_name == 'schedule' && 'latest' || inputs.channel || 'pinned' }}
      SCENARIO: ${{ github.event_name == 'schedule' && 'smoke' || inputs.scenario || 'core' }}
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: The key for this tool
        id: key
        shell: bash
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          KEY="$OPENAI_KEY"
          if [ "${{ matrix.tool }}" = claude-code ]; then KEY="$ANTHROPIC_KEY"; fi
          if [ -z "$KEY" ]; then echo "No key for ${{ matrix.tool }}." >&2; exit 1; fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok
        with:
          fetch-depth: 0
      - name: Git identity (the test makes commits in its sample projects)
        if: steps.key.outputs.ok
        run: git config --global user.email ci@example.com && git config --global user.name CI
      - uses: actions/setup-python@v7
        if: steps.key.outputs.ok
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: steps.key.outputs.ok
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The browser the test drives
        if: steps.key.outputs.ok
        working-directory: frontend
        run: npm ci && npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: ConPTY for interactive CLIs
        if: steps.key.outputs.ok && runner.os == 'Windows'
        run: python -m pip install pywinpty==3.1.0
      - name: Claude Code
        if: steps.key.outputs.ok && matrix.tool == 'claude-code'
        shell: bash
        run: npm install -g "$(python scripts/ci/agent_packages.py "$CHANNEL" claude-code)"
      - name: Codex, logged in with the key
        if: steps.key.outputs.ok && matrix.tool == 'codex'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install -g "$(python scripts/ci/agent_packages.py "$CHANNEL" codex)"
          # The login lands in ~/.codex/auth.json, which the test copies into its own home.
          printenv OPENAI_API_KEY | codex login --with-api-key
      - name: OpenCode
        if: steps.key.outputs.ok && matrix.tool == 'opencode'
        shell: bash
        run: npm install -g "$(python scripts/ci/agent_packages.py "$CHANNEL" opencode)"
      - name: An agent from clone to its work on the pages (${{ env.SCENARIO }}, ${{ env.CHANNEL }})
        if: steps.key.outputs.ok
        shell: bash
        env:
          # Claude Code and OpenCode take their key from the environment; Codex has its login file.
          ANTHROPIC_API_KEY: ${{ matrix.tool == 'claude-code' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.tool == 'opencode' && secrets.OPENAI_API_KEY || '' }}
        run: |
          model=haiku
          if [ "${{ matrix.tool }}" = "codex" ]; then model="${{ vars.CODEX_MODEL }}"; fi
          if [ "${{ matrix.tool }}" = "opencode" ]; then model="openai/${{ vars.CODEX_MODEL || 'gpt-6-luna' }}"; fi
          budget=900
          if [ "$SCENARIO" != full ]; then budget=120; fi
          python scripts/fresh_user/run.py --tools ${{ matrix.tool }} --scenario "$SCENARIO" \
            --stages install,setup,wiring,agent --turn-seconds "$budget" ${model:+--model "$model"}
      - name: The failed checks, with their detail (on failure)
        if: failure() && steps.key.outputs.ok
        shell: python
        run: |
          import json
          from pathlib import Path
          report = Path(".sp/fresh-user/report.json")
          if not report.is_file():
              print("no report: the run stopped before the install stage ended")
          else:
              for c in json.loads(report.read_text(encoding="utf-8")).get("checks", []):
                  if not c.get("ok"):
                      print(f"[{c.get('stage')}] {c.get('name')}\n    {c.get('detail', '')[-4000:]}")
      - name: Report CLI version and model cost
        if: always() && steps.key.outputs.ok
        run: python scripts/ci/agent_summary.py
      - name: Keep the report and the pictures
        if: always() && steps.key.outputs.ok
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.tool }}-${{ matrix.os }}
          path: .sp/fresh-user/
          include-hidden-files: true
