# The blank-machine kit (scripts/machine) on GitHub's runners: bootstrap.sh
# or bootstrap.ps1 from this checkout (SP_LOCAL), with no login prompts (the
# keys come from the repository secrets), then run.py with Claude Code, Codex
# and OpenCode. The runners are not blank — git, Node and Python are there —
# so this checks the scripts and the run, not every install. It costs money
# (real agents on three systems): by hand, or on a push to the ci-machine
# branch (a dispatch needs the file on the default branch first).
name: Machine

on:
  push:
    branches: [ci-machine]
  workflow_dispatch:
    inputs:
      full:
        description: "all three agents on all three systems (9 runs, ~$4-8); off: Claude Code on all three, Codex and OpenCode on Linux (5 runs)"
        type: boolean
        default: false

# One run at a time: a second push waits instead of paying twice.
concurrency:
  group: machine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  machine:
    name: Machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SP_LOCAL: "1"
      SP_NONINTERACTIVE: "1"
      SP_ARCHIVE_DIR: ${{ github.workspace }}/.sp/archive
      # Every agent on Linux; on macOS and Windows Claude Code alone, unless full.
      TOOLS: ${{ (inputs.full || matrix.os == 'ubuntu-latest') && 'claude-code,codex,opencode' || 'claude-code' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}      # empty: Codex's own default
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the upgrade stage installs the last release tag first
      - name: Git identity (the run makes commits in its sample projects)
        run: git config --global user.email ci@example.com && git config --global user.name CI
      - name: The kit, Linux and macOS
        if: runner.os != 'Windows'
        run: bash scripts/machine/bootstrap.sh --tools "$TOOLS"
      - name: The kit, Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/machine/bootstrap.ps1 --tools "$env:TOOLS"
      - name: The archive it made
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: machine-${{ matrix.os }}
          # Only the archive: run.py cut the secrets out of it. The raw step
          # logs are not uploaded; a bootstrap failure shows in this job's log.
          path: .sp/archive/sp-machine-*.zip
          if-no-files-found: warn
          retention-days: 14
