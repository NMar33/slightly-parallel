name: User profiles
run-name: ${{ inputs.expect_failure && format('Pipeline probe {0} / User profiles', inputs.probe_id) || 'User profiles' }}

on:
  workflow_dispatch:
    inputs:
      expect_failure:
        description: Inject and check a failure in every job without running normal steps
        type: boolean
        default: false
      probe_id:
        description: ID of the pipeline self-test dispatching this run
        type: string
        default: ''
  push:
    branches: [ci-user-profiles]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  no-node:
    name: Dashboard without Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Pipeline probe starts
        if: inputs.expect_failure
        working-directory: .
        run: echo SP_PIPELINE_PROBE_STARTED
      - name: Pipeline probe rejects a failed native command
        if: inputs.expect_failure
        working-directory: .
        run: |
          bash -c 'echo SP_PIPELINE_NATIVE_FAILURE; exit 73'
          echo SP_PIPELINE_UNREACHABLE
      - name: Pipeline probe rejects a failed PowerShell command
        if: failure() && inputs.expect_failure && runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -Command 'Write-Output SP_PIPELINE_POWERSHELL_FAILURE; exit 73'
          Write-Output SP_PIPELINE_UNREACHABLE
      - uses: actions/checkout@v7
        if: ${{ !inputs.expect_failure }}
      - uses: actions/setup-python@v7
        if: ${{ !inputs.expect_failure && (runner.os != 'Linux') }}
        with:
          python-version: '3.12'
      - name: Run the shipped dashboard with Node removed from PATH
        if: ${{ !inputs.expect_failure && (runner.os != 'Linux') }}
        run: python scripts/fresh_user/profile.py no-node
      - name: Run the shipped dashboard and native agent CLIs in a container with no Node
        if: ${{ !inputs.expect_failure && (runner.os == 'Linux') }}
        run: |
          docker run --rm --volume "$PWD:/candidate:ro" --workdir /candidate python:3.12-slim bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y --no-install-recommends curl git ca-certificates unzip tar
            export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
            curl -fsSL https://claude.ai/install.sh | bash -s 2.1.330
            curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.3
            codex_asset=codex-x86_64-unknown-linux-musl
            curl -fsSL "https://github.com/openai/codex/releases/download/rust-v0.170.0/$codex_asset.tar.gz" | tar -xz -C /tmp "$codex_asset"
            install -m 0755 "/tmp/$codex_asset" "$HOME/.local/bin/codex"
            claude --version
            codex --version
            opencode --version
            if command -v node >/dev/null; then
              echo "Node unexpectedly available in the no-Node container" >&2
              exit 1
            fi
            python scripts/fresh_user/profile.py no-node
          '

  windows-profile:
    name: Windows redirected Cyrillic home (PowerShell)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Pipeline probe starts
        if: inputs.expect_failure
        working-directory: .
        run: echo SP_PIPELINE_PROBE_STARTED
      - name: Pipeline probe rejects a failed native command
        if: inputs.expect_failure
        working-directory: .
        run: |
          bash -c 'echo SP_PIPELINE_NATIVE_FAILURE; exit 73'
          echo SP_PIPELINE_UNREACHABLE
      - name: Pipeline probe rejects a failed PowerShell command
        if: failure() && inputs.expect_failure && runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -Command 'Write-Output SP_PIPELINE_POWERSHELL_FAILURE; exit 73'
          Write-Output SP_PIPELINE_UNREACHABLE
      - uses: actions/checkout@v7
        if: ${{ !inputs.expect_failure }}
      - uses: actions/setup-python@v7
        if: ${{ !inputs.expect_failure }}
        with:
          python-version: '3.12'
      - name: Redirect the user and temporary folders to Cyrillic paths
        if: ${{ !inputs.expect_failure }}
        run: python scripts/fresh_user/profile.py windows-cyrillic-home
      - name: Record Windows profile coverage
        if: ${{ !inputs.expect_failure }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Content $env:GITHUB_STEP_SUMMARY 'The redirected Cyrillic home passed. A separate Windows local-account trial exited 1 in run 45097517111. Coverage is the redirected home.'
