# The backend tests on Windows alone, for working on them: the whole CI
# takes half an hour on Windows, this job about five minutes. It runs on
# the ci-windows branch and by hand; main is checked by ci.yml.
name: Windows backend

on:
  push:
    branches: [ci-windows]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (windows-latest, Python 3.12)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Git identity (tests make commits in temporary repositories)
        run: git config --global user.email ci@example.com && git config --global user.name CI
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -p no:warnings tests

  fresh-user:
    # The fresh-user test on Windows, with no agent: being made to work here
    # before it joins the matrix in ci.yml.
    name: Fresh user (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Git identity (the test makes commits in its sample projects)
        run: git config --global user.email ci@example.com && git config --global user.name CI
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The browser the test drives
        working-directory: frontend
        run: npm ci && npx playwright install chromium
      - name: From clone to a working setup
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python scripts/fresh_user/run.py --no-agent --no-agent
      - name: The failed checks, with their detail (on failure)
        if: failure()
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import json
          from pathlib import Path
          report = Path(".sp/fresh-user/report.json")
          if not report.is_file():
              print("no report: the run stopped before the install stage ended")
          else:
              for c in json.loads(report.read_text(encoding="utf-8")).get("checks", []):
                  if not c.get("ok"):
                      print(f"[{c.get('stage')}] {c.get('name')}\n    {c.get('detail', '')[-4000:]}")
      - name: Keep the report and the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fresh-user-windows
          path: .sp/fresh-user/
          include-hidden-files: true
