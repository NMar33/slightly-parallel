name: Weekly
run-name: ${{ inputs.expect_failure && format('Pipeline probe {0} / Weekly', inputs.probe_id) || 'Weekly' }}

# The checks too slow for every push on every system, once a week on all
# three, by hand (Actions → Weekly → Run workflow, once this file is on the
# default branch), and on a push that changes this file or one of its tests. Each push runs the
# heavy tests on Linux only (ci.yml). Free: GitHub's standard runners, no tokens.
on:
  schedule:
    - cron: "17 3 * * 1"   # Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      expect_failure:
        description: Inject and check a failure in every job without running normal steps
        type: boolean
        default: false
      probe_id:
        description: ID of the pipeline self-test dispatching this run
        type: string
        default: ''
  push:
    paths:
      - .github/workflows/weekly.yml
      - backend/tests/test_write_fuzzer.py
      - backend/tests/test_hook_concurrency.py
      - backend/tests/test_parser_properties.py
      - backend/tests/test_real_cli.py
      - scripts/ci/stub_model.py

defaults:
  run:
    shell: bash

jobs:
  heavy:
    # The write fuzzer and the hooks at once (marker "heavy"), on each system.
    name: Heavy tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Pipeline probe starts
        if: inputs.expect_failure
        working-directory: .
        run: echo SP_PIPELINE_PROBE_STARTED
      - name: Pipeline probe rejects a failed native command
        if: inputs.expect_failure
        working-directory: .
        run: |
          bash -c 'echo SP_PIPELINE_NATIVE_FAILURE; exit 73'
          echo SP_PIPELINE_UNREACHABLE
      - name: Pipeline probe rejects a failed PowerShell command
        if: failure() && inputs.expect_failure && runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -Command 'Write-Output SP_PIPELINE_POWERSHELL_FAILURE; exit 73'
          Write-Output SP_PIPELINE_UNREACHABLE
      - uses: actions/checkout@v7
        if: ${{ !inputs.expect_failure }}
      - name: Git identity (tests make commits in temporary repositories)
        if: ${{ !inputs.expect_failure }}
        run: git config --global user.email ci@example.com && git config --global user.name CI
      - uses: actions/setup-python@v7
        if: ${{ !inputs.expect_failure }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        if: ${{ !inputs.expect_failure }}
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: "The heavy tests (-rs: a skipped test is named)"
        if: ${{ !inputs.expect_failure }}
        timeout-minutes: 20
        env:
          # The Windows CPython traceback timer can crash the worker while dumping a healthy fuzz run.
          PYTEST_ADDOPTS: ${{ runner.os == 'Windows' && '-o faulthandler_timeout=0' || '' }}
        run: python -m pytest -q -rs --junitxml=pytest.xml tests -m heavy
      - name: Only the skips expected on this system
        if: ${{ !inputs.expect_failure }}
        run: python ../scripts/ci/check_skips.py pytest.xml --minimum 2

  properties:
    # The transcript and JSONL readers' property tests with many more
    # examples than a push tries, from a new seed each week.
    name: Property tests, deep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Pipeline probe starts
        if: inputs.expect_failure
        working-directory: .
        run: echo SP_PIPELINE_PROBE_STARTED
      - name: Pipeline probe rejects a failed native command
        if: inputs.expect_failure
        working-directory: .
        run: |
          bash -c 'echo SP_PIPELINE_NATIVE_FAILURE; exit 73'
          echo SP_PIPELINE_UNREACHABLE
      - name: Pipeline probe rejects a failed PowerShell command
        if: failure() && inputs.expect_failure && runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -Command 'Write-Output SP_PIPELINE_POWERSHELL_FAILURE; exit 73'
          Write-Output SP_PIPELINE_UNREACHABLE
      - uses: actions/checkout@v7
        if: ${{ !inputs.expect_failure }}
      - uses: actions/setup-python@v7
        if: ${{ !inputs.expect_failure }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        if: ${{ !inputs.expect_failure }}
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: "3 000 examples each (SP_HYPOTHESIS=deep); a failure prints the example to replay"
        if: ${{ !inputs.expect_failure }}
        env:
          SP_HYPOTHESIS: deep
        run: |
          python -m pytest -q -rs --junitxml=properties.xml tests/test_parser_properties.py -o addopts=""
          python ../scripts/ci/check_skips.py properties.xml --minimum 5

  codex-latest:
    # The newest Codex, not the pinned one (ci.yml pins 0.167.0): a release
    # that changes the answer codexlimits reads shows here before users meet
    # it. Logged in with the API key, as in ci.yml; it spends no tokens.
    name: Newest Codex (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Pipeline probe starts
        if: inputs.expect_failure
        working-directory: .
        run: echo SP_PIPELINE_PROBE_STARTED
      - name: Pipeline probe rejects a failed native command
        if: inputs.expect_failure
        working-directory: .
        run: |
          bash -c 'echo SP_PIPELINE_NATIVE_FAILURE; exit 73'
          echo SP_PIPELINE_UNREACHABLE
      - name: Pipeline probe rejects a failed PowerShell command
        if: failure() && inputs.expect_failure && runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -Command 'Write-Output SP_PIPELINE_POWERSHELL_FAILURE; exit 73'
          Write-Output SP_PIPELINE_UNREACHABLE
      - uses: actions/checkout@v7
        if: ${{ !inputs.expect_failure }}
      - uses: actions/setup-python@v7
        if: ${{ !inputs.expect_failure }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: ${{ !inputs.expect_failure }}
        with:
          node-version: 22
      - name: Install the backend and the newest Codex with an empty profile
        if: ${{ !inputs.expect_failure }}
        env:
          CODEX_HOME: ${{ runner.temp }}/sp-signed-out-codex
        shell: bash
        run: |
          python -m pip install -q -r backend/requirements.txt
          python -c 'import os; from pathlib import Path; Path(os.environ["CODEX_HOME"]).mkdir(parents=True, exist_ok=True)'
          npm install -g @openai/codex@latest
          echo "Codex $(codex --version) (ci.yml pins 0.167.0)"
      - name: Codex limits RPC rejects a signed-out account
        if: ${{ !inputs.expect_failure }}
        env:
          CODEX_HOME: ${{ runner.temp }}/sp-signed-out-codex
        run: python scripts/ci/check_codex_limits.py --expect-signed-out
      - name: The real server reports the signed-out Codex limits response
        if: ${{ !inputs.expect_failure }}
        env:
          CODEX_HOME: ${{ runner.temp }}/sp-signed-out-codex
        run: python scripts/ci/codex_server_check.py --expect-signed-out

  claude-latest:
    # The newest Claude Code against the stub model: a release that renames a
    # hook event, a payload field or the MCP loading shows here first.
    name: Real Claude Code latest against a stub model (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Pipeline probe starts
        if: inputs.expect_failure
        working-directory: .
        run: echo SP_PIPELINE_PROBE_STARTED
      - name: Pipeline probe rejects a failed native command
        if: inputs.expect_failure
        working-directory: .
        run: |
          bash -c 'echo SP_PIPELINE_NATIVE_FAILURE; exit 73'
          echo SP_PIPELINE_UNREACHABLE
      - name: Pipeline probe rejects a failed PowerShell command
        if: failure() && inputs.expect_failure && runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -Command 'Write-Output SP_PIPELINE_POWERSHELL_FAILURE; exit 73'
          Write-Output SP_PIPELINE_UNREACHABLE
      - uses: actions/checkout@v7
        if: ${{ !inputs.expect_failure }}
      - name: Git identity (tests make commits in temporary repositories)
        if: ${{ !inputs.expect_failure }}
        run: git config --global user.email ci@example.com && git config --global user.name CI
      - uses: actions/setup-python@v7
        if: ${{ !inputs.expect_failure }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        if: ${{ !inputs.expect_failure }}
        with:
          node-version: 22
      - name: Install dependencies and Claude Code latest
        if: ${{ !inputs.expect_failure }}
        run: |
          pip install -r requirements.lock -r requirements-dev.txt
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
      - name: "One turn: the hooks record it, the MCP server writes a decision (scripts/ci/stub_model.py; no tokens)"
        if: ${{ !inputs.expect_failure }}
        env:
          SP_REAL_CLI: "1"
        run: |
          python -m pytest -q -rs -o addopts="" --junitxml=real-claude.xml tests/test_real_cli.py
          python ../scripts/ci/check_skips.py real-claude.xml --one-passed
