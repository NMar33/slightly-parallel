<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#3E9B84" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090A" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Slightly Parallel — one glance across every AI agent and project." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <title>Slightly Parallel</title>

    <!-- Prevent theme flash: apply saved / system theme before React mounts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sp-theme') || localStorage.getItem('merkhet-theme'); // the second: a browser from before the rename
          var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = saved === 'dark' || saved === 'light' ? saved : sys;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body class="bg-base text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
